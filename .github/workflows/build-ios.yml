name: Build unsigned iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test API transport without network or API keys
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -parse-as-library App/AITransport.swift Tests/APIContractTests.swift -o /tmp/xinglan-api-tests
          /tmp/xinglan-api-tests
      - name: Build iPhone app and widget without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Xinglan.xcodeproj \
            -scheme Xinglan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Xinglan.app"
          test -f "$APP/Xinglan"
          test -d "$APP/PlugIns/XinglanWidget.appex"
          mkdir -p package/Payload
          ditto "$APP" package/Payload/Xinglan.app
          cd package
          zip -qry ../Xinglan-unsigned.ipa Payload
          cd ..
          shasum -a 256 Xinglan-unsigned.ipa > SHA256.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xinglan-unsigned-IPA
          path: |
            Xinglan-unsigned.ipa
            SHA256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

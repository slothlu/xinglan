name: 混沌启动器 iOS 云打包

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: iOS Bundle ID
        type: string
        default: local.lumian.chaoslauncher

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: 检出启动器源码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: 配置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: 安装构建工具
        run: brew install make ldid

      - name: 构建 iOS IPA
        env:
          CHAOS_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: BOOT_JDK_HOME="$JAVA_HOME" bash scripts/build-cloud-ios.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChaosLauncher-iOS
          path: artifacts/ChaosLauncher-iOS.ipa
          if-no-files-found: error
          compression-level: 0
